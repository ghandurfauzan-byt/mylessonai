services:
  # 1. Service Backend API (Point 2: Docker Image Repo Backend)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: explainmylesson-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=user
      - DB_PASSWORD=password123
      - DB_NAME=explainmylesson_db
      - DATABASE_URL=mysql://user:password123@mysql:3306/explainmylesson_db
      - CHROMA_URL=http://chromadb:8000
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
    depends_on:
      mysql:
        condition: service_healthy
      chromadb:
        condition: service_started
      ollama:
        condition: service_started

  # 2. Service MySQL Database (Point 3: Mount Database ke Docker Image)
  mysql:
    image: mysql:8.0
    container_name: explainmylesson-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootsecret
      - MYSQL_DATABASE=explainmylesson_db
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "user", "-ppassword123"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 3. Service ChromaDB Vector Database (RAG Vector Store)
  chromadb:
    image: chromadb/chroma:latest
    container_name: explainmylesson-chromadb
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  # 4. Service Local LLM Engine via Ollama (Point 4: Integrasi Local LLM ke Backend)
  ollama:
    image: ollama/ollama:latest
    container_name: explainmylesson-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  mysql_data:
    name: explainmylesson_mysql_data
  chroma_data:
    name: explainmylesson_chroma_data
  ollama_data:
    name: explainmylesson_ollama_data
